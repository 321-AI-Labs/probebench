[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probebench"
version = "1.0.0"
description = "Behavioral-preservation verification for weight-edited models: 120-prompt refusal-drift probe suite with three independent judges"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ProbeBench contributors" }]
keywords = ["llm", "evaluation", "behavioral-preservation", "weight-edit", "refusal"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # stdlib only by design (urllib, http.server, json, hashlib)

[project.scripts]
probebench = "probebench.cli:main"

[tool.setuptools]
packages = ["probebench"]
